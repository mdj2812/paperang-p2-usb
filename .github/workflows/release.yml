name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Verify import
        run: python3 -c "from paperang import PaperangP2; print('Import OK')"

      - name: Run ruff
        run: |
          python3 -m pip install ruff
          ruff check *.py examples/

      - name: Package release assets
        run: |
          mkdir -p dist/paperang-p2-usb
          cp paperang_p2.py profiles.json requirements.txt README.md LICENSE dist/paperang-p2-usb/
          cd dist
          tar czf paperang-p2-usb.tar.gz paperang-p2-usb/
          zip -qr paperang-p2-usb.zip paperang-p2-usb/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/paperang-p2-usb.tar.gz
            dist/paperang-p2-usb.zip
