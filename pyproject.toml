[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperang-p2-usb"
version = "1.3.0"
description = "CLI + MQTT wrapper for Paperang P2 thermal printer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "paperang-p2-lib>=0.2.0",
    "paho-mqtt>=2.0.0",
]

[project.scripts]
paperang-p2 = "paperang_p2:main"

[tool.setuptools]
py-modules = ["paperang_p2", "mqtt_print"]
